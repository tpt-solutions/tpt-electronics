# Third-party (all MIT OR Apache-2.0) — dev/wasm only where possible
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
