tpt-elec-power-core = { path = "crates/power/tpt-elec-power-core", version = "0.1.0" }
tpt-elec-power-magnetics = { path = "crates/power/tpt-elec-power-magnetics", version = "0.1.0" }
tpt-elec-power-switches = { path = "crates/power/tpt-elec-power-switches", version = "0.1.0" }
