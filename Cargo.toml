tpt-elec-pi-pdn = { path = "crates/signal-integrity/tpt-elec-pi-pdn", version = "0.1.0" }
tpt-elec-pi-decoupling = { path = "crates/signal-integrity/tpt-elec-pi-decoupling", version = "0.1.0" }
