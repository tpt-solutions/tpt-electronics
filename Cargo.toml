[workspace]
resolver = "2"
# tpt-electronics workspace: every crate is a workspace member.
members = [
    "crates/core/*",
    "crates/formats/*",
    "crates/thermal/*",
    "crates/circuit/*",
    "crates/signal-integrity/*",
    "crates/rf/*",
    "crates/power/*",
    "crates/semiconductor/*",
    "crates/emc/*",
    "crates/battery/*",
    "crates/manufacturing/*",
    "crates/cli/*",
    "benches",
    "examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-electronics"
homepage = "https://github.com/tpt-solutions/tpt-electronics"
documentation = "https://docs.rs/tpt-elec-core"
authors = ["TPT Solutions <open@tpt.solutions>"]
keywords = ["pcb", "thermal", "spice", "signal-integrity", "simulation"]
categories = ["science", "simulation"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Internal crates (strict MIT OR Apache-2.0 chain, path + version pinned)
tpt-elec-core = { path = "crates/core/tpt-elec-core", version = "0.1.0" }
tpt-elec-materials = { path = "crates/core/tpt-elec-materials", version = "0.1.0" }
tpt-elec-geometry = { path = "crates/core/tpt-elec-geometry", version = "0.1.0" }
tpt-elec-gerber = { path = "crates/formats/tpt-elec-gerber", version = "0.1.0" }
tpt-elec-kicad = { path = "crates/formats/tpt-elec-kicad", version = "0.1.0" }
tpt-elec-odbpp = { path = "crates/formats/tpt-elec-odbpp", version = "0.1.0" }
tpt-elec-ipc2581 = { path = "crates/formats/tpt-elec-ipc2581", version = "0.1.0" }
tpt-elec-touchstone = { path = "crates/formats/tpt-elec-touchstone", version = "0.1.0" }
tpt-elec-spice-netlist = { path = "crates/formats/tpt-elec-spice-netlist", version = "0.1.0" }
tpt-elec-thermal = { path = "crates/thermal/tpt-elec-thermal", version = "0.1.0" }
tpt-elec-joule = { path = "crates/thermal/tpt-elec-joule", version = "0.1.0" }
tpt-elec-transient = { path = "crates/thermal/tpt-elec-transient", version = "0.1.0" }
tpt-elec-convection = { path = "crates/thermal/tpt-elec-convection", version = "0.1.0" }
tpt-elec-spice-core = { path = "crates/circuit/tpt-elec-spice-core", version = "0.1.0" }
tpt-elec-spice-models = { path = "crates/circuit/tpt-elec-spice-models", version = "0.1.0" }
tpt-elec-spice-analysis = { path = "crates/circuit/tpt-elec-spice-analysis", version = "0.1.0" }
tpt-elec-spice-noise = { path = "crates/circuit/tpt-elec-spice-noise", version = "0.1.0" }
tpt-elec-si-core = { path = "crates/signal-integrity/tpt-elec-si-core", version = "0.1.0" }
tpt-elec-si-impedance = { path = "crates/signal-integrity/tpt-elec-si-impedance", version = "0.1.0" }
tpt-elec-si-crosstalk = { path = "crates/signal-integrity/tpt-elec-si-crosstalk", version = "0.1.0" }
