# cargo-deny configuration for tpt-electronics.
# Policy per spec §7: strict permissive-only license chain (MIT OR Apache-2.0).
# GPL contamination is rejected: Elmer FEM, OpenFOAM, GMSH, Netgen must never
# enter the dependency graph (they are external GPL/LGPL tools, not Rust
# crates — the lint below documents intent and will reject any crate that
# ever appears under those names).

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # GPL / LGPL simulation tools that must never be vendored or wrapped.
    # These names do not exist on crates.io; listing them is an explicit tripwire.
    { name = "elmer-fem" },
    { name = "openfoam" },
    { name = "gmsh" },
    { name = "netgen" },
    { name = "ngspice-sys" },
]

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
