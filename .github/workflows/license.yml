name: License check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  cargo-deny:
    name: cargo-deny (licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
