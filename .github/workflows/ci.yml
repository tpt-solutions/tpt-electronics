name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The top-level `RUSTFLAGS: -D warnings` env var takes full precedence
      # over .cargo/config.toml's `target.'cfg(macos)'.rustflags`, so the
      # pyo3 macOS linker workaround there never reaches the linker unless
      # it's folded into RUSTFLAGS itself. Append it here, macOS-only, so
      # `-D warnings` is preserved everywhere.
      - name: Add pyo3 macOS linker workaround to RUSTFLAGS
        if: runner.os == 'macOS'
        run: echo "RUSTFLAGS=$RUSTFLAGS -C link-arg=-undefined -C link-arg=dynamic_lookup" >> "$GITHUB_ENV"
      - run: cargo test --workspace

  goldens:
    name: Golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Check-only. The goldens are verified against independent closed-form
      # references and never rewritten, so this job cannot bless a regression
      # in the code it is checking.
      - name: Check golden fixtures against their analytic references
        run: cargo run -p xtask -- regen-goldens

  deny-bans:
    name: cargo-deny (bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources

  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      # `tpt-elec-wasm` is excluded on purpose: its blocker is a wasm-bindgen
      # *build*-dependency that needs rustc 1.77, which says nothing about our
      # own code. The wasm target is already covered by the `wasm` job below on
      # stable, which is where that risk actually lives.
      - name: Check the workspace on the declared MSRV
        run: cargo check --workspace --exclude tpt-elec-wasm

  wasm:
    name: WASM build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check tpt-elec-wasm for the browser target
        run: cargo check -p tpt-elec-wasm --target wasm32-unknown-unknown
